services:
  - type: web
    name: craftstudio-lxd
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/rise.db
      - key: UPLOADS_DIR
        value: /data/uploads
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
