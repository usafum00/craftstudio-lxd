<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#flowGrad)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- Badge Indicator -->
  <g transform="translate(60, 60)">
    <rect width="180" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#1e3a8a" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">GOOGLE FLOW</text>
  </g>

  <!-- Style Preset Pill -->
  <g transform="translate(255, 60)">
    <rect width="160" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">PHOTOREALISTIC OFFICE</text>
  </g>

  <!-- Aspect Ratio Pill -->
  <g transform="translate(430, 60)">
    <rect width="90" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="45" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">16:9</text>
  </g>

  <!-- Visual Centerpiece Art -->
  <g transform="translate(800, 430)">
    <circle r="140" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <circle r="100" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <polygon points="0,-60 52,30 -52,30" fill="none" stroke="#1e3a8a" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#1e3a8a" />
  </g>

  <!-- Prompt Caption Box -->
  <g transform="translate(60, 770)">
    <rect width="1480" height="70" rx="16" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" letter-spacing="1">PROMPT:</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f8fafc">Modern corporate glass office with security turnstiles, cinematic blue and orange ambient lighting</text>
  </g>
</svg>