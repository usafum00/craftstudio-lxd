<svg viewBox="0 0 400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Waist-Fade Gradient Mask matching Articulate Rise Cutouts -->
    <linearGradient id="waistFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="78%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="96%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="400" height="520" fill="url(#waistFade)" />
    </mask>
    <!-- Dynamic drop shadow for authentic character grounding -->
    <filter id="cutoutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Grounding Silhouette Soft Contact Shadow on Floor -->
  <ellipse cx="200" cy="510" rx="140" ry="12" fill="#000000" fill-opacity="0.28" filter="blur(6px)" />

  <g mask="url(#fadeMask)" filter="url(#cutoutShadow)">
    <!-- SHOULDERS & TORSO CLOTHING -->
    <path d="M 90 520 L 105 340 Q 120 280 160 270 L 240 270 Q 280 280 295 340 L 310 520 Z" fill="#0284c7" />

    <!-- CHEST / INNER SHIRT -->
    <path d="M 160 270 L 200 370 L 240 270 Z" fill="#0284c7" />

    

    

    

    <!-- SUIT JACKET LAPELS -->
    <path d="M 155 270 L 175 380 L 160 390 L 135 320 Z" fill="#0284c7" opacity="0.9" />
    <path d="M 245 270 L 225 380 L 240 390 L 265 320 Z" fill="#0284c7" opacity="0.9" />

    
      <!-- Left Hand Gesture (Talking/Explaining) -->
      <path d="M 120 380 Q 90 320 120 280 Q 135 290 130 330 Z" fill="#d69769" />
      <circle cx="115" cy="280" r="14" fill="#d69769" />
    

    <!-- NECK -->
    <path d="M 175 230 L 175 280 Q 200 295 225 280 L 225 230 Z" fill="#d69769" />
    <path d="M 175 245 Q 200 260 225 245 L 225 255 Q 200 270 175 255 Z" fill="#000000" fill-opacity="0.12" />

    <!-- HEAD & JAW -->
    <ellipse cx="200" cy="180" rx="42" ry="52" fill="#d69769" />

    <!-- EARS -->
    <circle cx="156" cy="182" r="10" fill="#d69769" />
    <circle cx="244" cy="182" r="10" fill="#d69769" />

    <!-- EYES -->
    <ellipse cx="184" cy="175" rx="5" ry="4" fill="#ffffff" />
    <circle cx="184" cy="175" r="2.5" fill="#18181b" />
    <ellipse cx="216" cy="175" rx="5" ry="4" fill="#ffffff" />
    <circle cx="216" cy="175" r="2.5" fill="#18181b" />

    <!-- EYEBROWS (Pose responsive) -->
    <path d="M 175 160 Q 185 158 193 162" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
    <path d="M 207 162 Q 215 158 225 160" stroke="#18181b" stroke-width="3" stroke-linecap="round" />

    <!-- NOSE -->
    <path d="M 200 175 L 198 192 L 204 192" stroke="#d69769" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- MOUTH (Pose responsive) -->
    <path d="M 190 203 Q 200 218 210 203 Q 200 210 190 203 Z" stroke="#7f1d1d" stroke-width="2.5" stroke-linecap="round" fill="#991b1b" />

    <!-- Natural Styled Hair -->
    <path d="M 152 170 Q 150 120 200 120 Q 250 120 248 170 Q 235 135 200 135 Q 165 135 152 170 Z" fill="#292524" />
    
    
  </g>
</svg>