<svg width="1280" height="548" viewBox="0 0 1280 548" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="548" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="548" fill="url(#bgGrad)" />

  <!-- Subtle Architecture / Perspective Grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="420" x2="1280" y2="420" />
    <line x1="160" y1="0" x2="160" y2="548" />
    <line x1="480" y1="0" x2="480" y2="548" />
    <line x1="800" y1="0" x2="800" y2="548" />
    <line x1="1120" y1="0" x2="1120" y2="548" />
  </g>

  <!-- Central Modern Office Scene -->
  <!-- Desk Base -->
  <rect x="240" y="380" width="800" height="14" rx="4" fill="#475569" />
  <rect x="260" y="394" width="20" height="154" fill="#334155" />
  <rect x="1000" y="394" width="20" height="154" fill="#334155" />

  <!-- Laptop Display -->
  <rect x="490" y="190" width="300" height="190" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="4" />
  <rect x="502" y="202" width="276" height="166" rx="4" fill="url(#screenGrad)" />
  <polygon points="460,380 820,380 800,392 480,392" fill="#94a3b8" />

  <!-- Laptop Screen Security Alert Content -->
  <rect x="522" y="222" width="236" height="34" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
  <circle cx="542" cy="239" r="8" fill="#ef4444" />
  <text x="542" y="243" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
  <text x="558" y="243" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">PHISHING WARNING: SUSPICIOUS SENDER</text>

  <!-- Email Lines on Screen -->
  <rect x="522" y="268" width="160" height="8" rx="2" fill="#94a3b8" opacity="0.6" />
  <rect x="522" y="284" width="220" height="6" rx="2" fill="#64748b" opacity="0.5" />
  <rect x="522" y="296" width="190" height="6" rx="2" fill="#64748b" opacity="0.5" />
  <rect x="522" y="308" width="210" height="6" rx="2" fill="#64748b" opacity="0.5" />
  <rect x="522" y="324" width="90" height="20" rx="4" fill="url(#accentGrad)" />
  <text x="567" y="337" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">REPORT EMAIL</text>

  <!-- Left Character (Employee examining email) -->
  <circle cx="410" cy="240" r="38" fill="#cbd5e1" />
  <path d="M350 380 C350 310, 380 290, 410 290 C440 290, 470 310, 470 380 Z" fill="#3b82f6" />
  <!-- Arm pointing to screen -->
  <path d="M440 330 Q475 310 500 290" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- Right Character (Colleague leaning in to consult) -->
  <circle cx="870" cy="220" r="36" fill="#f8fafc" />
  <path d="M810 380 C810 295, 840 275, 870 275 C900 275, 930 295, 930 380 Z" fill="#6366f1" />
  <path d="M840 310 Q800 300 780 305" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Floating Shield Icon -->
  <g transform="translate(615, 90)">
    <circle cx="25" cy="25" r="35" fill="#0f172a" stroke="#ff5722" stroke-width="3" />
    <path d="M25 8 L44 16 V28 C44 40, 25 48, 25 48 C25 48, 6 40, 6 28 V16 Z" fill="url(#accentGrad)" />
    <path d="M19 27 L23 31 L32 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Title Pill Overlay -->
  <rect x="440" y="480" width="400" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#475569" stroke-width="1" />
  <circle cx="460" cy="498" r="5" fill="#22c55e" />
  <text x="474" y="502" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">
    DEFENDING AGAINST SOCIAL ENGINEERING • LESSON 1
  </text>
</svg>